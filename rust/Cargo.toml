[package]
name = "shiguang"
version = "0.2.0"
edition = "2021"
description = "A polished countdown calendar for Windows"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
